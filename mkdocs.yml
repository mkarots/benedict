site_name: Benedict
site_description: An agent that knows your code, your Slack project talk, and can help you plan
repo_url: https://github.com/mkarots/benedict
repo_name: mkarots/benedict
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - toc.follow

hooks:
  - docs/mkdocs_hooks.py

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
      - Install and run: install.md
      - Slack setup: SLACK_SETUP.md
      - MCP: MCP.md
  - Use:
      - Slack commands: commands.md
      - Progress loop: PROGRESS.md
      - Operator console: OPERATOR_UI_DESIGN.md
  - How it works:
      - Request path: REQUEST_PATH.md
      - Code map: CODE_MAP.md
  - Reference:
      - Configuration: configuration.md
      - Troubleshooting: troubleshooting.md
  - Maintain:
      - Docs process: PROCESS.md
      - Continuous integration: ci.md
      - Changelog: changelog.md

exclude_docs: |
  OPEN_SOURCE_GUIDE_INDEX.md
  adr/**
  COMMAND_CLASSIFIER_DESIGN.md
  COMMAND_CLASSIFIER_API_DESIGN.md
  LLM_COMMAND_CLASSIFIER_DESIGN.md
