site_name: Benedict
site_description: Slack bot that answers questions about a local git checkout
repo_url: https://github.com/mkarots/benedict
repo_name: mkarots/benedict
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Index: README.md
  - Process: PROCESS.md
  - Setup:
      - Slack setup: SLACK_SETUP.md
      - MCP: MCP.md
  - How it works:
      - Code reading guide: CODE_READING_GUIDE.md
      - Request path: REQUEST_PATH.md
      - Progress loop: PROGRESS.md
  - Design:
      - Operator UI: OPERATOR_UI_DESIGN.md
  - Decisions:
      - "ADR 0001: Local operator UI": adr/0001-local-operator-ui.md
      - "ADR 0002: Progress loop": adr/0002-progress-loop.md
  - Historical:
      - Command classifier: COMMAND_CLASSIFIER_DESIGN.md
      - Command classifier API: COMMAND_CLASSIFIER_API_DESIGN.md
      - LLM command classifier: LLM_COMMAND_CLASSIFIER_DESIGN.md

exclude_docs: |
  OPEN_SOURCE_GUIDE_INDEX.md
