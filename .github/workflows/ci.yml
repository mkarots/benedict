name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check tests

      - name: Format
        run: uv run black --check tests

      - name: Type check
        continue-on-error: true
        run: uv run mypy src/benedict

      - name: Tests
        run: uv run pytest tests/ -v --cov=src/benedict --cov-report=term-missing

      - name: Security scan
        continue-on-error: true
        run: uv run bandit -q -r src/benedict
