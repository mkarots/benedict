name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - name: Install package and dev tools
        run: uv pip install -e ".[dev]"
      - name: Ruff and Black
        # Call the venv tools directly. `uv run` re-resolves uv.lock and can
        # pull a different Ruff than the pinned dev extra.
        run: |
          ruff check src tests
          black --check src tests

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - name: Install package and dev tools
        run: uv pip install -e ".[dev]"
      - name: Mypy
        run: mypy src/benedict

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
      - name: Install package and dev tools
        run: uv pip install -e ".[dev]"
      - name: Pytest
        # Do not use `uv run` here: it syncs uv.lock, which was resolved on a
        # newer Python and pins onnxruntime wheels that 3.10 does not have.
        run: pytest --cov=src/benedict --cov-report=term-missing --cov-report=xml
      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
