name: Feature request
description: Suggest a feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What should Benedict do?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Who needs this and when?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: Optional. How might this work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What else did you consider?
