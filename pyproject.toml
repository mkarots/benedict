[project]
name = "benedict"
version = "0.6.25"
description = "A Slack bot that links channels to repositories and provides intelligent, repo-scoped AI agent conversations"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Michael Karotsieris", email = "michael.karotsieris@gmail.com"},
]
maintainers = [
    {name = "Michael Karotsieris", email = "michael.karotsieris@gmail.com"},
]
keywords = [
    "slack-bot",
    "slack-app",
    "llm",
    "ai",
    "claude",
    "semantic-search",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = [
    "slack-bolt>=1.18.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.18.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "pylint",
    "flake8",
    "black==26.1.0",
    "ruff==0.15.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "mypy==2.3.1",
    "pre-commit>=4.0.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/mkarots/benedict"
Repository = "https://github.com/mkarots/benedict"
Issues = "https://github.com/mkarots/benedict/issues"
Changelog = "https://github.com/mkarots/benedict/blob/main/CHANGELOG.md"

[project.scripts]
benedict = "benedict.main:main"
benedict-mcp = "benedict.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benedict"]

[tool.hatch.build.targets.wheel.force-include]
"src/benedict/operator_ui/static/index.html" = "benedict/operator_ui/static/index.html"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Keep this set stable so a Ruff upgrade does not turn on pyupgrade/isort by default.
select = ["E4", "E7", "E9", "F"]

[tool.pylint]
max-line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
# Do not type-check site-packages (NumPy 2 stubs use 3.12-only syntax).
no_site_packages = true

# Existing modules with type errors. Tighten as hints land; do not grow this list.
[[tool.mypy.overrides]]
module = [
    "benedict.agent",
    "benedict.indexers.slack_history_indexer",
    "benedict.lib.logging",
    "benedict.llm.llm_claude",
    "benedict.llm.llm_mock",
    "benedict.metadata.content_handlers",
    "benedict.metadata.metadata_generator",
    "benedict.operator_ui.recorder",
    "benedict.operator_ui.server",
    "benedict.progress.decide",
    "benedict.protocols.conversation_history_indexer",
    "benedict.protocols.semantic_indexer",
    "benedict.repo_change_detector.git_change_detector",
    "benedict.repo_reader.repo_reader_local",
    "benedict.repo_reader.repo_reader_mock",
    "benedict.semantic_indexer.semantic_indexer_chromadb",
    "benedict.utils.context",
    "benedict.utils.slack_formatter",
]
ignore_errors = true
